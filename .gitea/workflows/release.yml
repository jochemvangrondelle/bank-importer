name: Release

on:
  push:
    branches:
      - develop
      - beta
      - stable
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - beta
          - stable

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Configure Git
        run: |
          git config --global user.name "semantic-release"
          git config --global user.email "semantic-release@gitea.com"

      - name: Run semantic-release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITEA_API_URL: ${{ vars.GITEA_API_URL || 'https://git.jochempiya.org/api/v1' }}
        run: |
          uv run semantic-release version
          uv run semantic-release changelog
          uv run semantic-release publish
