name: CI

on:
  push:
    branches:
      - develop
      - beta
      - stable
      - main
  pull_request:
    branches:
      - develop
      - beta
      - stable
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: git.jochempiya.org/astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify uv installation
        run: uv --version

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v -n auto

      - name: Run linting
        run: |
          uv run --python ${{ matrix.python-version }} ruff check src/ tests/
          uv run --python ${{ matrix.python-version }} mypy src/

  tox-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: git.jochempiya.org/astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify uv installation
        run: uv --version

      - name: Install tox with tox-uv
        run: uv tool install tox --with tox-uv

      - name: Verify tox installation
        run: tox --version

      - name: Run tox tests (sequential)
        run: tox

      - name: Run tox tests (parallel)
        run: tox --parallel auto

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: git.jochempiya.org/astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Verify uv installation
        run: uv --version

      - name: Install dependencies
        run: uv sync --group dev --python 3.11

      - name: Build package
        run: uv build

      - name: Build package (no sources)
        run: uv build --no-sources
