[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
runner = uv-venv-lock-runner
package = editable
extras = dev
passenv = PYTHON_VERSION
setenv =
    COVERAGE_FILE = .coverage.{envname}
commands =
    # Run tests with coverage (aligned with Make test command)
    python -m pytest tests/ -v -n auto --cov=src/ --cov-report=xml --cov-report=term-missing
    # Run linting (aligned with Make lint command)
    ruff check src/ tests/
    ruff format --check src/ tests/
    mypy src/
