[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# Use uv plugin for tox (tox-uv)
runner = uv-venv-lock-runner
package = editable
groups = dev
passenv = PYTHON_VERSION
setenv =
    COVERAGE_FILE = .coverage.{envname}
commands =
    # Run tests with coverage in parallel (optimized for performance)
    # Note: Coverage is collected per-worker and combined automatically
    python -m pytest tests/ -v -n auto --cov=src/bank_importer --cov-report=xml --cov-report=term-missing --cov-report=html
    # Run linting (ruff - strict mode)
    ruff check src/ tests/
    ruff format --check src/ tests/
    # Run type checking (mypy - strict mode)
    mypy src/ --strict
    # Run type checking (pyright - strict mode)
    pyright src/
