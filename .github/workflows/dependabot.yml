name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Run all checks (same as CI) to ensure Dependabot PRs pass all quality gates
  # This ensures Dependabot PRs are held to the same standards as regular PRs
  check:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Run type checking (mypy - strict)
        run: uv run mypy src/ --strict

      - name: Run type checking (pyright - strict)
        run: uv run pyright src/

      - name: Run linting (ruff - strict)
        run: uv run ruff check src/

      - name: Check formatting
        run: uv run ruff format --check src/

  # Build check to ensure package builds correctly
  build-check:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: uv build

  # Wait for main CI workflow to pass, then auto-merge
  # The main CI workflow runs on all PRs, so we wait for it to complete successfully
  # Note: Dependabot PRs have read-only permissions, so we use a PAT if available
  wait-for-ci:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: [check, build-check]
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Wait for CI workflow to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "test"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

  # Auto-merge only after all checks pass (both this workflow and main CI)
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: [check, build-check, wait-for-ci]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: minor
          merge-method: squash
