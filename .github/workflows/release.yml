name: Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Python executable path for Rust
        id: python_path
        run: |
          PYTHON_EXEC=$(python3.11 -c "import sys; print(sys.executable)" 2>/dev/null || python -c "import sys; print(sys.executable)")
          echo "python_executable=$PYTHON_EXEC" >> $GITHUB_OUTPUT
          echo "Using Python: $PYTHON_EXEC"
          $PYTHON_EXEC --version

      - name: Build package first (needed for semantic-release)
        run: uv build

      - name: Build Rust CLI binaries
        working-directory: rust-cli
        env:
          PYO3_PYTHON: ${{ steps.python_path.outputs.python_executable }}
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          cargo build --release
          cp target/release/bank-importer-cli ../dist/bank-importer-cli-linux-amd64
          chmod +x ../dist/bank-importer-cli-linux-amd64

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish

      - name: Get version from package
        id: version
        run: |
          # Install package first to get version
          uv pip install -e .
          VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('bank-importer'))" 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Determine Docker tags
        id: docker_tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          BRANCH="${{ github.ref_name }}"

          # Determine release tag based on branch
          if [ "$BRANCH" = "main" ]; then
            RELEASE_TAG="stable"
          elif [ "$BRANCH" = "develop" ]; then
            RELEASE_TAG="latest"
          else
            RELEASE_TAG="latest"
          fi

          echo "tags=$VERSION_TAG,$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Docker tags: $VERSION_TAG, $RELEASE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.docker_tags.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.docker_tags.outputs.release_tag }}
          labels: |
            org.opencontainers.image.title=Bank Importer Thailand
            org.opencontainers.image.description=A Python application that parses Thai bank export PDFs and exports transactions to CSV format suitable for import into Firefly-III
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.licenses=AGPL-3.0
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
