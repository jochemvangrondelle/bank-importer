name: Build Rust CLI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  build-rust-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: bank-importer-cli-linux-amd64
            python_version: "3.11"
          - os: macos-latest
            artifact_name: bank-importer-cli-macos-arm64
            python_version: "3.11"
          - os: windows-latest
            artifact_name: bank-importer-cli-windows-amd64.exe
            python_version: "3.11"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Get Python executable path
        id: python_path
        shell: bash
        run: |
          PYTHON_EXEC=$(python${{ matrix.python_version }} -c "import sys; print(sys.executable)" 2>/dev/null || python -c "import sys; print(sys.executable)")
          echo "python_executable=$PYTHON_EXEC" >> $GITHUB_OUTPUT
          echo "Using Python: $PYTHON_EXEC"
          $PYTHON_EXEC --version

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: rust-cli
        env:
          PYO3_PYTHON: ${{ steps.python_path.outputs.python_executable }}
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo build --release

      - name: Build Rust CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: rust-cli
        env:
          PYO3_PYTHON: ${{ steps.python_path.outputs.python_executable }}
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        shell: bash
        run: cargo build --release

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        working-directory: rust-cli
        run: |
          cp target/release/bank-importer-cli target/release/${{ matrix.artifact_name }}
          chmod +x target/release/${{ matrix.artifact_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        working-directory: rust-cli
        shell: bash
        run: |
          cp target/release/bank-importer-cli.exe target/release/${{ matrix.artifact_name }}

      - name: Upload Rust CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust-cli/target/release/${{ matrix.artifact_name }}
          retention-days: 30

      - name: Upload to release (if release event)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: rust-cli/target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream
