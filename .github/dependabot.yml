version: 2
updates:
  # Enable version updates for Python dependencies (works with uv projects)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Commit message configuration
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Labels for PRs
    labels:
      - "dependencies"
      - "python"
    # Automatically update both pyproject.toml and uv.lock
    versioning-strategy: "increase"
    # Ignore major version updates by default (uncomment to enable)
    # ignore:
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-major"]
