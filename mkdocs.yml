  - Home: index.md
  - Features: features.md
  - Core Library:
      - Library API: api/library.md
      - Config Manager: api/config.md
      - Processor: api/processor.md
      - Database Manager: api/database.md
      - Parser Detector: api/parser_detector.md
      - Target Manager: api/target_manager.md
      - Translation Service: api/translation.md
      - Models:
          - Transaction: api/transaction.md
          - Bank Account: api/bank-account.md
      - Interfaces:
          - Parser Interface: api/parser.md
          - Target Interface: api/target.md
      - Parsers:
          - Krungsri: api/parsers/krungsri.md
          - SCB: api/parsers/scb.md
          - Generic: api/parsers/generic.md
      - Targets:
          - CSV Target: api/targets/csv.md
          - YAML Target: api/targets/yaml.md
          - Firefly Target: api/targets/firefly.md
  - REST API:
      - Overview: api/rest-api.md
      - OpenAPI Specification: api/openapi.md
      - Endpoints:
          - System: api/rest-api/system.md
          - Configuration: api/rest-api/config.md
          - Parsers: api/rest-api/parsers.md
          - Import: api/rest-api/import.md
          - Export: api/rest-api/export.md
          - Translation: api/rest-api/translation.md
          - Status: api/rest-api/status.md
          - Database: api/rest-api/database.md
  - CLI:
      - Reference: cli/index.md
  - Guides:
      - Getting Started:
          - Installation: getting-started/installation.md
          - Quick Start: getting-started/quick-start.md
          - Configuration: getting-started/configuration.md
      - User Guides:
          - Firefly-III Import: user-guides/firefly-import.md
          - Generic Parsers: user-guides/generic-parsers.md
          - Translation Terms: user-guides/translation-terms.md
      - Development:
          - Developer Guide: development/developer-guide.md
          - Contributing: development/contributing.md
          - Pre-commit Setup: development/pre-commit-setup.md
          - Release Process: development/release-process.md
          - Version Management: development/version-management.md
          - Profiling: development/profiling.md
      - Operations:
          - Docker Optimization: operations/docker-optimization.md
          - Changelog Guide: operations/changelog-guide.md
