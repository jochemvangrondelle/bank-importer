# Extra files to include
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jochemvangrondelle/bank-importer
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/jochemvangrondelle/bank-importer
