site_name: Bank Importer Thailand
site_description: A Python application that parses Thai bank export PDFs and exports transactions to CSV format suitable for import into Firefly-III
site_url: https://bank-importer.readthedocs.io/
repo_url: https://github.com/jochemvangrondelle/bank-importer
repo_name: jochemvangrondelle/bank-importer
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Jochem van Grondelle

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - minify:
      minify_html: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          selection:
            docstring_style: google
            docstring_options:
              ignore_init_summary: false
          rendering:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            show_signature_annotations: true
            show_signature: true
            separate_signature: false
            line_length: 60
            heading_level: 3
            members_order: alphabetical
            docstring_section_style: table
            merge_init_into_class: true

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Navigation
