[tool.mypy]
files                       = ["src"]
disallow_untyped_defs       = true
disallow_any_unimported     = true
no_implicit_optional        = true
check_untyped_defs          = true
warn_return_any             = true
warn_unused_ignores         = true
show_error_codes            = true
strict_equality             = true
warn_redundant_casts        = true
warn_unused_configs         = true
warn_no_return              = true
warn_unreachable            = true
disallow_untyped_decorators = true
disallow_incomplete_defs    = true
disallow_untyped_calls      = true

    [[tool.mypy.overrides]]
    module                 = "firefly_iii_client.*"
    ignore_missing_imports = true

[tool.pyright]
include                      = ["src"]
exclude                      = ["tests", "venv", ".venv"]
typeCheckingMode             = "strict"
useLibraryCodeForTypes       = true
reportMissingImports         = true
reportMissingTypeStubs       = false
reportUnusedImport           = true
reportUnusedClass            = true
reportUnusedFunction         = true
reportUnusedVariable         = true
reportDuplicateImport        = true
reportOptionalSubscript      = true
reportOptionalMemberAccess   = true
reportOptionalCall           = true
reportOptionalIterable       = true
reportOptionalContextManager = true
reportOptionalOperand        = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/bank_importer_th",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "cli: CLI tests",
    "processor: Processor tests",
]

[tool.ruff]
target-version = "py311"
line-length    = 88
exclude        = ["__pycache__", ".git", ".venv", "venv", ".env", "src/submodules"]

    [tool.ruff.lint]
    select = [
        "E",  # pycodestyle errors
        "W",  # pycodestyle warnings
        "F",  # pyflakes
        "I",  # isort
        "B",  # flake8-bugbear
        "C4", # flake8-comprehensions
        "UP", # pyupgrade
    ]
    ignore = [
        "E501", # line too long, handled by black
        "B008", # do not perform function calls in argument defaults
        "C901", # too complex
        "F601", # dictionary key literal repeated (duplicate keys in translation terms)
        "W293", # blank line contains whitespace (minor formatting)
    ]

        [tool.ruff.lint.per-file-ignores]
        "__init__.py" = ["F401"]
        "src/submodules/firefly-iii-client/firefly_iii_client/**/*" = [
            "E501",
            "F401",
            "F403",
            "F405",
        ]

[tool.black]
target-version = ['py311']
line-length = 88
exclude = '''
/(
  src/submodules/firefly-iii-client/test
)/
'''

[tool.isort]
profile           = "black"
multi_line_output = 3
line_length       = 88
skip_glob         = ["src/submodules/firefly-iii-client/test/*"]

[tool.coverage.run]
source = ["src"]
