[project]
name = "bank-importer-th"
dynamic = ["version"]
# version = "0.1.0"
description = "Importer for TH PDF bank statements"
authors = [{ name = "Jochem van Grondelle", email = "jochem@vangrondelle.net" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.9,<4.0"
dependencies = [
    "sqlmodel>=0.0.14",
    "click>=8.0.0",
    "toml>=0.10.0",
    "pdfplumber>=0.11.7",
    "types-toml>=0.10.8.20240310",
    "rich>=14.0.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

    [project.urls]
    Homepage      = "https://jochemvangrondelle.github.io/bank-importer-th/"
    Repository    = "https://github.com/jochemvangrondelle/bank-importer-th"
    Documentation = "https://jochemvangrondelle.github.io/bank-importer-th/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "mypy>=0.991",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "pyright>=1.1.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "python-semantic-release>=8.0.0",
    "commitizen>=3.0.0",
]

[build-system]
requires      = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_importer_th"]

[tool.mypy]
files                       = ["src"]
disallow_untyped_defs       = true
disallow_any_unimported     = true
no_implicit_optional        = true
check_untyped_defs          = true
warn_return_any             = true
warn_unused_ignores         = true
show_error_codes            = true
strict_equality             = true
warn_redundant_casts        = true
warn_unused_configs         = true
warn_no_return              = true
warn_unreachable            = true
disallow_untyped_decorators = true
disallow_incomplete_defs    = true
disallow_untyped_calls      = true

[tool.pyright]
include                      = ["src"]
exclude                      = ["tests", "venv", ".venv"]
typeCheckingMode             = "strict"
useLibraryCodeForTypes       = true
reportMissingImports         = true
reportMissingTypeStubs       = false
reportUnusedImport           = true
reportUnusedClass            = true
reportUnusedFunction         = true
reportUnusedVariable         = true
reportDuplicateImport        = true
reportOptionalSubscript      = true
reportOptionalMemberAccess   = true
reportOptionalCall           = true
reportOptionalIterable       = true
reportOptionalContextManager = true
reportOptionalOperand        = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/bank_importer_th",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "cli: CLI tests",
    "processor: Processor tests",
]

[tool.ruff]
target-version = "py311"
line-length    = 120
fix            = true

    [tool.ruff.lint]
    select = [
        # flake8-2020
        "YTT",
        # flake8-bandit
        "S",
        # flake8-bugbear
        "B",
        # flake8-builtins
        "A",
        # flake8-comprehensions
        "C4",
        # flake8-debugger
        "T10",
        # flake8-simplify
        "SIM",
        # isort
        "I",
        # mccabe
        "C90",
        # pycodestyle
        "E",
        "W",
        # pyflakes
        "F",
        # pygrep-hooks
        "PGH",
        # pyupgrade
        "UP",
        # ruff
        "RUF",
        # tryceratops
        "TRY",
        # pydocstyle
        "D",
    ]
    ignore = [
        # LineTooLong
        "E501",
        # DoNotAssignLambda
        "E731",
        # Missing docstring
        "D100",
        "D101",
        "D102",
        "D103",
        "D104",
        "D105",
        "D106",
        "D107",
    ]

        [tool.ruff.lint.per-file-ignores]
        "tests/*" = ["S101"]

    [tool.ruff.format]
    preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variable = "src/bank_importer_th/__init__.py:__version__"
build_command = "uv build"
dist_path = "dist"
upload_to_vcs_release = true
upload_to_pypi = false
upload_to_release = true
hvcs = "gitea"
remote = "origin"
major_on_zero = false
prerelease_tag = "beta"
prerelease = true
prerelease_token = "beta"
build_commit_message = "chore: build {version} [skip ci]"
commit_author = "semantic-release <semantic-release@gitea.com>"
commit_subject = "chore: release {version}"
commit_message = "chore: release {version}\n\nAutomatically generated by python-semantic-release"
tag_commit = true
tag_message = "chore: release {version}"
tag_subject = "Release {version}"
changelog_file = "CHANGELOG.md"
changelog_scope = "src/bank_importer_th"
changelog_sections = [
    "feat",
    "fix",
    "perf",
    "refactor",
    "docs",
    "style",
    "test",
    "build",
    "ci",
    "chore",
]
changelog_ignore_merge_commits = true
changelog_ignore_commits_with = ["skip ci", "ci skip", "no ci", "skip changelog", "changelog skip"]
changelog_ignore_types = ["docs", "style", "test", "build", "ci", "chore"]

# Tag configuration for different branches
[tool.semantic_release.branches]
main    = { name = "latest", prerelease = false }
develop = { name = "develop", prerelease = true, prerelease_token = "alpha" }
beta    = { name = "beta", prerelease = true, prerelease_token = "beta" }
stable  = { name = "stable", prerelease = false }

# Gitea-specific settings
[tool.semantic_release.gitea]
domain = "git.jochempiya.org"

[tool.commitizen]
name                     = "cz_conventional_commits"
version                  = "1.0.0"
tag_format               = "v$version"
version_scheme           = "pep440"
version_provider         = "semantic-release"
update_changelog_on_bump = true
major_version_zero       = true
