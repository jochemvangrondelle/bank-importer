[project]
name = "bank-importer-th"
dynamic = ["version"]
description = "A Python application that parses Thai bank export PDFs and exports transactions to CSV format suitable for import into Firefly-III"
authors = [{ name = "Jochem van Grondelle", email = "jochem@vangrondelle.net" }]
readme = "README.md"
license = { text = "GNU Affero General Public License v3" }
keywords = ['python', 'bank', 'pdf', 'parser', 'firefly-iii', 'thailand', 'financial']
requires-python = ">=3.9,<4.0"
dependencies = [
    "sqlmodel>=0.0.14",
    "typer>=0.9.0",
    "toml>=0.10.0",
    "pdfplumber>=0.11.7",
    "types-toml>=0.10.8.20240310",
    "rich>=14.0.0",
    "firefly-iii-api-client>=6.2.10.0", # Local path dependency - has enum bug but works for our use case
    "google-trans>=2.4.0",
    "googletrans>=4.0.2",
    "pyyaml>=6.0.2",
    "pytz>=2024.1",
    "deep-translator>=1.11.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

    [project.urls]
    Homepage      = "https://jochemvangrondelle.github.io/bank-importer-th/"
    Repository    = "https://github.com/jochemvangrondelle/bank-importer-th"
    Documentation = "https://jochemvangrondelle.github.io/bank-importer-th/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "mypy>=0.991",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    "pyright>=1.1.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "python-semantic-release>=8.0.0",
    "commitizen>=3.0.0",
]

[tool.uv.sources]
firefly-iii-api-client = { path = "src/submodules/firefly-iii-client" }


    [project.scripts]
    bank-importer-th = "bank_importer_th.cli_main:app"

[build-system]
requires      = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_importer_th"]
