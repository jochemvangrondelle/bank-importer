version: "3.8"

services:
  bank-importer:
    build: .
    container_name: bank-importer-th
    volumes:
      # Mount input directory (bank statements)
      - ./data/in:/app/data/in:ro
      # Mount output directory (exports)
      - ./data/out:/app/data/out
      # Mount logs directory
      - ./logs:/app/logs
      # Mount config file (optional)
      - ./config.toml:/app/config.toml:ro
    # Example usage:
    # docker-compose run --rm bank-importer import-files data/in/
    # docker-compose run --rm bank-importer export --target csv
    # docker-compose run --rm bank-importer status
